[package]
name = "xfce4-niri-lib"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["Antonio Salsi"]
description = "Utility to better integrate Xfce4 applications with the WM niri"
license = "LGPL-2.1-or-later"
repository = "https://github.com/passy1977/xfce4-niri"
homepage = "https://github.com/passy1977/xfce4-niri"
documentation = "https://docs.rs/xfce4-niri"
readme = "../README.md"
keywords = ["niri", "xfce4", "embedded", "posix"]

[features]
# The unit test helpers, so the other crates of the workspace can use them
# too. Only ever switched on by a dev-dependency: off in a normal build.
test-support = []

[dependencies]
glib = "0.18"
osal-rs = { git = "https://github.com/HiHappyGarden/osal-rs.git", features = ["posix"]}